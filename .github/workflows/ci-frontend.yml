name: CI - Frontend

on: 
  pull request:
    paths: 
      - "frontend/**"
      - ". github/workfLows/ci-frontend.ymL"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  linter:
    name: Biome
    runs-on: ubuntu-Latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci 
      - run: npx biome check --all

  test:
    needs: linter
    name: Vitest
    runs-on: ubuntu-Latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci 
      - run: npm run test