[project]
name = "backend"
version = "0.1.0"
description = "This project allows the user to rate the books they've read by inserting it's title, author(s), rate and notes. Also, these informations can be retrieved anytime on the platform so the user can see and have a history of books they've read and their opinion about it."
authors = [
    {name = "Lanna Correia e Silva",email = "lanna.correia@gec.inatel.br"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.6,<0.18.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [{ include = "app" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
Line-Length = 88
target-version = "py312"

[tool.ruff. lint]
select = [
    "E", # pycodestyle errors
    "w", # pycodestyle warnings
    "F", # pyflakes (erros de sintaxe e imports não usados)
    "I", # isort (ordenação automática e padronizada de imports)
    "UP", # pyupgrade (garante sintaxe moderna de Python 3.12+)
    "B", # flake8-bugbear (pega bugs comuns)
]

1gnore = []